<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project AI.ri: Transfurmados</title>
    <link rel="stylesheet" href="styles.css?v=20260723-2">
    <link rel="stylesheet" href="battle-styles.css?v=20260724-19">
</head>
<body>
    <div id="viewport">
    <div id="game-container">
        <!-- Fondo de la escena -->
        <div id="background" class="background"></div>

        <!-- Vídeo de fondo del MENÚ PRINCIPAL (loop, ralentizado por game.js y
             SIEMPRE mudo: su sonido de base se reproduce aparte como
             ambiente_menu.mp3 a velocidad normal, bajito, tras el primer
             clic/tecla — los navegadores no permiten audio antes de un gesto).
             Se oculta al empezar a jugar. -->
        <video id="menu-video" class="menu-video" autoplay muted loop playsinline
               poster="assets/backgrounds/menu_cover.png?v=20260720-21"
               src="assets/videos/menu_loop.mp4?v=20260723-2"></video>

        <!-- Personajes -->
        <div id="characters-container" class="characters-container">
            <div id="character-left" class="character left"></div>
            <div id="character-right" class="character right"></div>
            <div id="character-center" class="character center"></div>
        </div>

        <!-- Caja de diálogo con estilo Persona 5 -->
        <div id="dialog-box" class="dialog-box p5-style">
            <div class="p5-dialog-header">
                <div class="character-name" id="character-name"></div>
                <div class="p5-nameplate"></div>
            </div>
            <div class="p5-dialog-content">
                <div class="p5-border-top"></div>
                <div class="dialog-text" id="dialog-text"></div>
                <div class="p5-border-bottom"></div>
            </div>
            <div class="dialog-continue p5-continue">▼</div>
        </div>

        <!-- Menú de elecciones con estilo Persona 5 -->
        <div id="choices-container" class="choices-container p5-choices"></div>

        <!-- Menú principal (diseño "Neón de Medianoche": el logo es un letrero de
             neón sobre la ciudad y las opciones una lista limpia abajo-izquierda) -->
        <div id="main-menu" class="main-menu neon-menu">
            <div class="nm-scrim"></div>
            <div class="nm-grain"></div>
            <div class="nm-logo">
                <div class="nm-over">Project AI.ri</div>
                <h1>Trans<span class="nm-fur">fur</span>mados</h1>
                <div class="nm-tag">más de lo que ven tus ojos</div>
            </div>
            <nav class="nm-nav">
                <button id="start-btn" class="nm-item">Comenzar</button>
                <button id="load-btn" class="nm-item">Capítulos</button>
                <button id="settings-btn" class="nm-item">Configuración</button>
            </nav>
            <button id="menu-theme-btn" class="menu-theme-btn" title="Volver a escuchar el tema">♪</button>

            <!-- Sello de la empresa: WildSoft -->
            <div class="nm-credit" aria-label="Un juego de WildSoft">
                <div class="nm-credit-over">un juego de</div>
                <div class="nm-credit-row">
                    <img class="nm-credit-emblema" src="assets/ui/wildsoft_emblema_claro.png?v=20260722-1" alt="">
                    <img class="nm-credit-word" src="assets/ui/wildsoft_letras.png?v=20260722-1" alt="WILDSOFT">
                </div>
            </div>
        </div>

        <!-- Panel de Debug -->
        <div id="debug-panel" class="debug-panel hidden">
            <div class="debug-header">
                <h3>Debug Mode</h3>
                <button id="debug-close" class="debug-close">✕</button>
            </div>
            <div class="debug-content">
                <div class="debug-info">
                    <p><strong>Capítulo:</strong> <span id="debug-chapter">-</span></p>
                    <p><strong>Escena:</strong> <span id="debug-scene">-</span></p>
                    <p><strong>Línea:</strong> <span id="debug-line">-</span></p>
                </div>
                <div class="debug-controls">
                    <input type="number" id="debug-line-input" min="0" placeholder="Ir a línea...">
                    <button id="debug-goto-line">Ir</button>
                    <button id="debug-reload">Recargar JSON</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="p5-effects.js?v=20260716-2"></script>
    <script src="battle-minigame.js?v=20260724-23"></script>
    <script src="credits-minigame.js?v=20260724-1"></script>
    <script src="juice.js?v=20260722-1"></script>
    <script src="engine.js?v=20260723-4"></script>
    <script src="game.js?v=20260723-2"></script>

    <!-- Escalado del escenario: dibuja el juego a 1280x720 y lo escala como bloque
         para llenar la ventana manteniendo la proporción (bandas negras si no es 16:9). -->
    <script>
      (function () {
        var DESIGN_W = 1280, DESIGN_H = 720;
        function fitStage() {
          var s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
          document.documentElement.style.setProperty('--stage-scale', s);
        }
        window.addEventListener('resize', fitStage);
        window.addEventListener('orientationchange', fitStage);
        fitStage();
      })();
    </script>
</body>
</html>
