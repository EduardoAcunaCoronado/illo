<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Con pelos y a lo loco</title>
    <link rel="stylesheet" href="styles.css?v=20260719-4">
    <link rel="stylesheet" href="battle-styles.css?v=20260720-16">
</head>
<body>
    <div id="viewport">
    <div id="game-container">
        <!-- Fondo de la escena -->
        <div id="background" class="background"></div>

        <!-- Personajes -->
        <div id="characters-container" class="characters-container">
            <div id="character-left" class="character left"></div>
            <div id="character-right" class="character right"></div>
            <div id="character-center" class="character center"></div>
        </div>

        <!-- Caja de diálogo con estilo Persona 5 -->
        <div id="dialog-box" class="dialog-box p5-style">
            <div class="p5-dialog-header">
                <div class="character-name" id="character-name"></div>
                <div class="p5-nameplate"></div>
            </div>
            <div class="p5-dialog-content">
                <div class="p5-border-top"></div>
                <div class="dialog-text" id="dialog-text"></div>
                <div class="p5-border-bottom"></div>
            </div>
            <div class="dialog-continue p5-continue">▼</div>
        </div>

        <!-- Menú de elecciones con estilo Persona 5 -->
        <div id="choices-container" class="choices-container p5-choices"></div>

        <!-- Menú principal -->
        <div id="main-menu" class="main-menu p5-main-menu">
            <div class="p5-menu-header">
                <h1>Con pelos y a lo loco</h1>
            </div>
            <nav class="p5-menu-nav">
                <button id="start-btn" class="menu-btn p5-menu-btn">
                    <span class="p5-btn-text">Comenzar</span>
                </button>
                <button id="load-btn" class="menu-btn p5-menu-btn">
                    <span class="p5-btn-text">Capítulos</span>
                </button>
                <button id="settings-btn" class="menu-btn p5-menu-btn">
                    <span class="p5-btn-text">Configuración</span>
                </button>
            </nav>
        </div>

        <!-- Panel de Debug -->
        <div id="debug-panel" class="debug-panel hidden">
            <div class="debug-header">
                <h3>Debug Mode</h3>
                <button id="debug-close" class="debug-close">✕</button>
            </div>
            <div class="debug-content">
                <div class="debug-info">
                    <p><strong>Capítulo:</strong> <span id="debug-chapter">-</span></p>
                    <p><strong>Escena:</strong> <span id="debug-scene">-</span></p>
                    <p><strong>Línea:</strong> <span id="debug-line">-</span></p>
                </div>
                <div class="debug-controls">
                    <input type="number" id="debug-line-input" min="0" placeholder="Ir a línea...">
                    <button id="debug-goto-line">Ir</button>
                    <button id="debug-reload">Recargar JSON</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="p5-effects.js?v=20260716-2"></script>
    <script src="battle-minigame.js?v=20260720-12"></script>
    <script src="juice.js?v=20260719-3"></script>
    <script src="engine.js?v=20260719-7"></script>
    <script src="game.js?v=20260720-11"></script>

    <!-- Escalado del escenario: dibuja el juego a 1280x720 y lo escala como bloque
         para llenar la ventana manteniendo la proporción (bandas negras si no es 16:9). -->
    <script>
      (function () {
        var DESIGN_W = 1280, DESIGN_H = 720;
        function fitStage() {
          var s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
          document.documentElement.style.setProperty('--stage-scale', s);
        }
        window.addEventListener('resize', fitStage);
        window.addEventListener('orientationchange', fitStage);
        fitStage();
      })();
    </script>
</body>
</html>
